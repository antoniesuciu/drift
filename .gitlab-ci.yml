stages:
  - test

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

foundation:
  stage: test
  image: ghcr.io/astral-sh/uv:0.13.6-python3.12-bookworm-slim
  variables:
    UV_CACHE_DIR: .uv-cache
    UV_LINK_MODE: copy
    UV_PYTHON_DOWNLOADS: never
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache/
  script:
    # Only dependency provisioning needs network; checks and tests run offline.
    - uv sync --locked --extra ib
    - uv lock --check --offline
    - uv run --locked --offline --extra ib ruff format --check .
    - uv run --locked --offline --extra ib ruff check .
    - uv run --locked --offline --extra ib mypy
    - uv run --locked --offline --extra ib pytest
    - uv run --locked --offline --extra ib quantlab smoke
    - uv pip check
